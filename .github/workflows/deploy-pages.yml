# Rebuild the Pages artifact after the source repository receives updates.
name: Deploy Masses Coalition website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          repository: demtaiwo1-eng/massescoalitionfornigeria
          ref: main
          path: app
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build static website
        working-directory: app
        run: npm run build
        env:
          SITE_URL: https://www.massescoalitionfornigeria.com
      - name: Add custom domain file
        run: |
          mkdir -p app/out
          printf 'www.massescoalitionfornigeria.com\n' > app/out/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
