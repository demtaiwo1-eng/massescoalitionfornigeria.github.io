# Rebuild Pages with the secure newsroom dashboard and current source revision.
name: Deploy Masses Coalition website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          repository: demtaiwo1-eng/massescoalitionfornigeria
          ref: main
          path: app
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build root-domain website
        working-directory: app
        run: |
          npm run build
          mv out site-root
        env:
          SITE_URL: https://demtaiwo1-eng.github.io/massescoalitionfornigeria.github.io
      - name: Build GitHub Pages project-path website
        working-directory: app
        run: |
          NEXT_BASE_PATH=/massescoalitionfornigeria.github.io npm run build
          mkdir -p site-root/massescoalitionfornigeria.github.io
          cp -a out/. site-root/massescoalitionfornigeria.github.io/
          rm -rf out
          mv site-root out
        env:
          SITE_URL: https://www.massescoalitionfornigeria.com
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
