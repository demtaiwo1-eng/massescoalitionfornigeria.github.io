name: Selenium external URL browser test

on:
  workflow_dispatch:
    inputs:
      external_url:
        description: External website URL to open in Chromium
        required: false
        default: https://www.massescoalitionfornigeria.com
  workflow_run:
    workflows: ["Deploy Masses Coalition website to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: selenium-external-url
  cancel-in-progress: true

jobs:
  browser-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out browser test configuration
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and matching ChromeDriver
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true
      - name: Install Selenium WebDriver
        run: npm install
      - name: Verify browser installation
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version
      - name: Open and verify external URL with Selenium
        run: npm run test:browser
        env:
          EXTERNAL_TEST_URL: ${{ github.event.inputs.external_url || 'https://www.massescoalitionfornigeria.com' }}
